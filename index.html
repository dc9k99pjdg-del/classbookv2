<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สมุดประจำวิชา</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="สมุดประจำวิชา">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#F3F4F9; --surface:#FFFFFF; --surface2:#EEF0F8; --ink:#1D2340; --muted:#5C6280; --line:#D9DCEA;
  --indigo:#2E3A87; --indigo-soft:#E3E6F7; --lotus:#B83E72; --saffron:#D9801A;
  --ok:#2E8B57; --ok-soft:#DDF1E5; --warn:#B88400; --warn-soft:#FBF0CF; --bad:#C2364A; --bad-soft:#F8DDE1;
  --late:#C9661E; --late-soft:#FBE6D6; --act:#2D6FB5; --act-soft:#DCE9F7; --leave:#8A6D00; --leave-soft:#F6EDC4;
  --shadow:0 1px 2px rgba(29,35,64,.08);
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11142A; --surface:#1A1E3A; --surface2:#232850; --ink:#E7E9F6; --muted:#A3A8C8; --line:#323862;
    --indigo:#9AA6F2; --indigo-soft:#2A3170; --lotus:#E785B0; --saffron:#F0A64B;
    --ok:#6FCF97; --ok-soft:#1D3B2C; --warn:#F2C94C; --warn-soft:#3B3418; --bad:#F2879A; --bad-soft:#47222C;
    --late:#F2A065; --late-soft:#45301F; --act:#86B6EE; --act-soft:#1F3554; --leave:#E8CF6A; --leave-soft:#3A3417;
    --shadow:none; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
    --bg:#11142A; --surface:#1A1E3A; --surface2:#232850; --ink:#E7E9F6; --muted:#A3A8C8; --line:#323862;
    --indigo:#9AA6F2; --indigo-soft:#2A3170; --lotus:#E785B0; --saffron:#F0A64B;
    --ok:#6FCF97; --ok-soft:#1D3B2C; --warn:#F2C94C; --warn-soft:#3B3418; --bad:#F2879A; --bad-soft:#47222C;
    --late:#F2A065; --late-soft:#45301F; --act:#86B6EE; --act-soft:#1F3554; --leave:#E8CF6A; --leave-soft:#3A3417;
    --shadow:none; color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun","TH Sarabun New",Tahoma,sans-serif;font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,select,textarea{touch-action:manipulation}
:focus-visible{outline:3px solid var(--lotus);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px 6px;max-width:1200px;margin:0 auto}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{font-size:20px;font-weight:800;color:var(--indigo)}
.brand span{font-size:13px;color:var(--muted)}
.save{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.save.busy{color:var(--saffron)} .save.err{color:var(--bad)}
.rooms{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;max-width:1200px;margin:0 auto;scrollbar-width:none}
.rooms::-webkit-scrollbar{display:none}
.room{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;font-weight:700;font-size:16px}
.room small{display:block;font-weight:500;font-size:11px;color:var(--muted);line-height:1}
.room[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:#fff}
.room[aria-pressed="true"] small{color:#E3E6F7}
main{max-width:1200px;margin:0 auto;padding:14px 16px 110px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;max-width:200px;border:0;background:none;padding:10px 4px 8px;font-size:14px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-selected="true"]{color:var(--indigo)}
.tabs button[aria-selected="true"] svg{stroke:var(--lotus)}
h2{font-size:22px;margin:0 0 4px;font-weight:800}
.sub{color:var(--muted);margin:0 0 12px;font-size:15px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:4px 10px;font-size:14px}
.muted{color:var(--muted)}
/* session strip */
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scroll-snap-type:x proximity}
.sess{flex:0 0 auto;scroll-snap-align:center;width:58px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 0;text-align:center;font-size:12px;line-height:1.2}
.sess b{display:block;font-size:17px}
.sess.done{border-color:var(--ok);background:var(--ok-soft)}
.sess.hol{background:var(--surface2);color:var(--muted);text-decoration:line-through}
.sess.exam{border-color:var(--saffron)}
.sess.today{box-shadow:inset 0 0 0 2px var(--lotus)}
.sess[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:#fff;text-decoration:none}
.info{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;margin-bottom:12px}
.info .when{font-size:19px;font-weight:700}
.info .what{color:var(--muted);font-size:15px}
.banner{border-radius:10px;padding:10px 14px;margin:0 0 12px;font-weight:600}
.banner.hol{background:var(--surface2);color:var(--muted)}
.banner.exam{background:var(--late-soft);color:var(--late)}
/* student rows */
.list{display:flex;flex-direction:column;gap:6px}
.st{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.st .no{font-weight:800;color:var(--indigo);text-align:center;font-variant-numeric:tabular-nums}
.st .nm{min-width:0}
.st .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.st .nm span{font-size:13px;color:var(--muted)}
.stamps{display:flex;gap:6px}
.stamp{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:19px;color:var(--muted);position:relative}
.stamp[aria-pressed="true"]{color:#fff;transform:rotate(-8deg);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.stamp.c-ม[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.stamp.c-ส[aria-pressed="true"]{background:var(--late);border-color:var(--late)}
.stamp.c-ก[aria-pressed="true"]{background:var(--act);border-color:var(--act)}
.stamp.c-ล[aria-pressed="true"],.stamp.c-ป[aria-pressed="true"]{background:var(--leave);border-color:var(--leave)}
.stamp.c-ข[aria-pressed="true"]{background:var(--bad);border-color:var(--bad)}
.stamp.c-✓[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.stamp.c-x[aria-pressed="true"]{background:var(--bad);border-color:var(--bad)}
@media (max-width:640px){.stamp{width:40px;height:40px;font-size:17px}.stamps{gap:4px}.st{grid-template-columns:30px minmax(0,1fr)}.st .stamps{grid-column:1/-1;justify-content:flex-end}}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.neu{background:var(--surface2);color:var(--muted)}
/* items */
.items{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.item{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:14px;font-weight:600}
.item.due{border-color:var(--saffron)}
.item[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:#fff}
.group-label{font-weight:700;margin:8px 0 6px;font-size:15px}
.switch{display:flex;align-items:center;gap:10px;font-weight:600}
.switch input{width:52px;height:30px;appearance:none;background:var(--line);border-radius:999px;position:relative;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--saffron)} .switch input:checked::after{left:25px}
.num{width:84px;height:46px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.num.missing{border-color:var(--bad);background:var(--bad-soft)}
/* monitor */
.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.count{border-radius:14px;padding:12px 14px;border:1px solid var(--line);background:var(--surface);text-align:left}
.count b{font-size:34px;font-weight:800;line-height:1;display:block;font-variant-numeric:tabular-nums}
.count span{font-size:14px;font-weight:600}
.count.bad b{color:var(--bad)} .count.warn b{color:var(--warn)} .count.ok b{color:var(--ok)}
.count[aria-pressed="true"]{outline:3px solid var(--indigo)}
.alert{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:10px 12px}
.alert.bad{border-left-color:var(--bad)} .alert.warn{border-left-color:var(--warn)} .alert.ok{border-left-color:var(--ok)}
.alert .who{font-weight:700;cursor:pointer}
.reasons{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.msg{grid-column:1/-1;font-size:14px;color:var(--muted)}
/* grid of 40 */
.dots{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.dot{aspect-ratio:1;border-radius:4px;background:var(--surface2);font-size:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.dot.ม{background:var(--ok)} .dot.ส{background:var(--late)} .dot.ก{background:var(--act)} .dot.ล,.dot.ป{background:var(--leave)} .dot.ข{background:var(--bad)} .dot.h{background:repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 3px,var(--line) 3px,var(--line) 6px)}
table{border-collapse:collapse;width:100%}
.tw{overflow-x:auto}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;font-size:15px}
th{font-size:13px;color:var(--muted);font-weight:700}
td.n{text-align:center;font-variant-numeric:tabular-nums}
/* dialog */
dialog{border:0;border-radius:16px;padding:0;max-width:720px;width:calc(100% - 24px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(17,20,42,.45)}
.dlg{padding:16px}
.dlg header{display:flex;align-items:start;gap:12px;margin-bottom:10px}
.dlg header h3{margin:0;font-size:21px}
.dlg header button{margin-left:auto}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 10px;font-size:16px;color:var(--ink);min-height:44px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
textarea.out{width:100%;min-height:160px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface2);padding:10px;font-size:15px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}.stamp[aria-pressed="true"]{transform:none}}
</style>
<style>
.bookbtn{border:1.5px solid var(--line);background:var(--surface2);border-radius:10px;padding:4px 10px;font-weight:700;font-size:14px;min-height:36px}
.sec{font-size:19px;margin:20px 0 8px}
.ed input,.ed select{border:1.5px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 8px;min-height:40px;width:100%}
.ed td{padding:4px}
.chg{display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.chg input{width:22px;height:22px}
.tag{display:inline-block;border-radius:6px;padding:0 8px;font-size:13px;font-weight:700;margin-right:6px}
.tag.in{background:var(--ok-soft);color:var(--ok)} .tag.out{background:var(--bad-soft);color:var(--bad)} .tag.move{background:var(--act-soft);color:var(--act)} .tag.no{background:var(--warn-soft);color:var(--warn)} .tag.new{background:var(--indigo-soft);color:var(--indigo)}
.note{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.st.out{opacity:.55}
.bk{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <div class="brand"><b id="brandTitle">สมุดประจำวิชา</b><span id="brandSub"></span></div>
    <button class="bookbtn" data-books>เปลี่ยนวิชา</button>
    <div class="save" id="save" aria-live="polite"></div>
  </div>
  <div class="rooms" id="rooms" role="toolbar" aria-label="เลือกห้อง"></div>
</div>
<main id="view"><div class="empty"><b>กำลังเปิดสมุด…</b></div></main>
<nav class="tabs" role="tablist" id="tabs">
  <button role="tab" data-tab="att" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="m8 12 3 3 5-6"/></svg>เช็กชื่อ</button>
  <button role="tab" data-tab="score"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16M7 16V9M12 16V5M17 16v-4"/></svg>งานและคะแนน</button>
  <button role="tab" data-tab="watch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/></svg>เฝ้าระวัง</button>
  <button role="tab" data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>ช่วยเหลือ</button>
  <button role="tab" data-tab="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>ตั้งค่า</button>
</nav>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<dialog id="cfm"><div class="dlg" id="cfmBody"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* ---------------- constants ---------------- */
const ATTR=["รักชาติ ศาสน์ กษัตริย์","ซื่อสัตย์สุจริต","มีวินัย","ใฝ่เรียนรู้","อยู่อย่างพอเพียง","มุ่งมั่นในการทำงาน","รักความเป็นไทย","มีจิตสาธารณะ"];
const QSUB=[4,2,1,2,2,2,3,2];
const LEVEL_NAME=["ไม่ผ่าน","ผ่าน","ดี","ดีเยี่ยม"];
const SLOTS={um01:"ก่อนกลางภาค (um01)",mid:"กลางภาค (midtermmark)",um02:"หลังกลางภาค (um02)",fin:"ปลายภาค (finalmark)",none:"ไม่ส่งเข้า BookMark"};
const SLOT_FILE={um01:"um01",mid:"midtermmark",um02:"um02",fin:"finalmark"};
const DAYS=["จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์"];
const CODES=["ม","ส","ก","ล","ป","ข"];
const CODE_NAME={"ม":"มา","ส":"สาย","ก":"กิจกรรม","ล":"ลากิจ","ป":"ลาป่วย","ข":"ขาด"};
const PREFIX=/^(นางสาว|นาย|นาง|เด็กชาย|เด็กหญิง|ด\.ช\.|ด\.ญ\.|น\.ส\.)\s*/;
const XLSX_URL="xlsx.full.min.js";
/* old single-book structure (used only to move old data into book 1) */

const pending={},timers={},saving={};

function docData(n){

const jobs={};
function persist(n){
  const fn=fullName(n); jobs[fn]=()=>docData(n); pending[fn]=true; setSave("กำลังบันทึก…","busy");
  clearTimeout(timers[fn]); timers[fn]=setTimeout(()=>flush(fn),300);

/* storage: everything stays on this device (IndexedDB; localStorage fallback) */
const KV={db:null,cache:{},ls:false};
function idbOpen(){return new Promise((res,rej)=>{let r;try{r=indexedDB.open("classbook",1)}catch(e){rej(e);return}r.onupgradeneeded=()=>{r.result.createObjectStore("kv")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function kvInit(){
  try{KV.db=await idbOpen();await new Promise((res,rej)=>{const rq=KV.db.transaction("kv","readonly").objectStore("kv").openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){KV.cache[c.key]=c.value;c.continue()}else res()};rq.onerror=()=>rej(rq.error)})}
  catch(e){KV.ls=true;try{KV.cache=JSON.parse(localStorage.getItem("classbook-local")||"{}")}catch(x){KV.cache={}}}
  try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist()}catch(e){}
}
function kvTx(fn){return new Promise((res,rej)=>{const tx=KV.db.transaction("kv","readwrite");fn(tx.objectStore("kv"));tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
async function kvPut(k,v){KV.cache[k]=v;if(KV.ls){localStorage.setItem("classbook-local",JSON.stringify(KV.cache));return}await kvTx(st=>st.put(v,k))}
async function kvDel(k){delete KV.cache[k];if(KV.ls){localStorage.setItem("classbook-local",JSON.stringify(KV.cache));return}await kvTx(st=>st.delete(k))}
const isSnap=k=>k.startsWith("snap:"),isMeta=k=>k==="meta";
function allDocs(){const o={};Object.keys(KV.cache).forEach(k=>{if(!isSnap(k)&&!isMeta(k)) o[k]=KV.cache[k]});return o}
async function writeDoc(fn,body){await kvPut(fn,body);noteChange()}
async function readDoc(fn){const v=KV.cache[fn];return v==null?null:clone(v)}
/* automatic daily snapshots kept on this device (last 7 days) */
let snapBusy=false;
async function noteChange(){
  const day=iso(new Date()),key="snap:"+day;if(snapBusy||KV.cache[key]) return;snapBusy=true;
  try{await kvPut(key,{at:new Date().toISOString(),docs:clone(allDocs())});
    const old=Object.keys(KV.cache).filter(isSnap).sort().reverse().slice(7);for(const k of old) await kvDel(k)}catch(e){}
  snapBusy=false;
}
const meta=()=>KV.cache.meta||{};
async function setMeta(o){await kvPut("meta",Object.assign({},meta(),o))}
async function flush(fn){
  if(saving[fn]){await saving[fn].catch(()=>{});}
  if(!pending[fn]) return;
  const body=clone(jobs[fn]());
  pending[fn]=false;
  const p=(async()=>{
    try{await writeDoc(fn,body);if(!Object.values(pending).some(Boolean)) setSave("บันทึกในเครื่องนี้แล้ว")}
    catch(e){pending[fn]=true;setSave("บันทึกไม่สำเร็จ กำลังลองใหม่…","err");clearTimeout(timers[fn]);timers[fn]=setTimeout(()=>flush(fn),3000)}
  })();
  saving[fn]=p; await p; if(saving[fn]===p) saving[fn]=null;
}
function flushAll(){return Promise.all(Object.keys(pending).filter(k=>pending[k]).map(k=>{clearTimeout(timers[k]);return flush(k)}))}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden") flushAll()});
window.addEventListener("pagehide",()=>{flushAll()});

function applyDoc(n,d){
  if(!d) return;
  if(n==="config") S.config=newConfig(d);
  else if(n==="rooms") S.rooms=d.list||[];
  else if(n==="logs") S.logs=d.items||[];
  else if(n.startsWith("att_")) S.att[n.slice(4)]=Object.assign({m:{}},d);
  else if(n.startsWith("sc_")) S.sc[n.slice(3)]=Object.assign(emptySc(),d);
}
function watch(n){
  if(MODE!=="db") return;
  const fn=fullName(n); if(unsubs[fn]) return; const bid=S.bid;
  try{unsubs[fn]=DB.doc(`data/users/${UID}/${fn}`).onSnapshot(s=>{
    if(bid!==S.bid||!s.exists||(s.metadata&&s.metadata.hasPendingWrites)||pending[fn]||saving[fn]) return;
    const data=clone(s.data());
    if(n==="books"){S.books=Object.assign(S.books,data);softRender();return}
    applyDoc(n,data); if(n==="rooms") S.rooms.forEach(r=>{ensureRoom(r);watch("att_"+r.id);watch("sc_"+r.id)}); softRender();
  },()=>{delete unsubs[fn]})}catch(e){}
}
function unwatchBook(){Object.keys(unsubs).forEach(k=>{if(k!=="books"){try{unsubs[k]()}catch(e){}delete unsubs[k]}})}

/* ---------------- boot / books ---------------- */
async function boot(){
  render();
  await kvInit();
  if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){try{navigator.serviceWorker.register("sw.js")}catch(e){}}
  try{
    const b=await readDoc("books");
    if(b){S.books=Object.assign(S.books,b)}
    else{
      const old=await readOld("rooms");
      if(old&&old.list&&old.list.length){await migrateOld(old);}
    }
    watch("books");
    if(S.books.cur&&S.books.list.some(x=>x.id===S.books.cur)) await openBook(S.books.cur);
    setSave(KV.ls?"บันทึกในเครื่องนี้ (โหมดสำรอง)":"บันทึกในเครื่องนี้");
  }catch(e){console.error(e);setSave("เปิดข้อมูลไม่สำเร็จ ลองรีเฟรช","err")}
  render();
}
async function readOld(n){
  try{const all=JSON.parse(localStorage.getItem("classbook")||"{}");return all[n]||null}catch(e){return null}
}
/* move old single-book data into book b1 (old documents are left untouched) */
async function migrateOld(oldRooms){
  const oc=await readOld("config")||{}, ol=await readOld("logs")||{};
  const form=[];for(let p=1;p<=38;p++) if(!OLD_SCORED.includes(p)) form.push(p);
  const sessions=[];for(let k=1;k<=40;k++) sessions.push(k<=19?`แผนที่ ${k} ${OLD_TITLES[k]}`:k===20?"สอบกลางภาค":k<=39?`แผนที่ ${k-1} ${OLD_TITLES[k-1]}`:"สอบปลายภาค");
  const cfg=newConfig({subject:oc.subject||"สังคมศึกษา 2",code:oc.code||"ส31103",term:oc.term||"2/2569",level:"4",start:oc.start||nextMonday(),holidays:oc.holidays||[],
    attMin:oc.attMin??0.8,pass:oc.pass??0.6,near:oc.near??2,task:oc.task??3,perWeek:2,sessions,
    forms:form.map((p,i)=>({id:"f"+i,name:`แผน ${p} ${OLD_TITLES[p]}`})),
    items:OLD_SUMM.map((x,j)=>({id:"s"+j,name:x[0],ind:x[1],max:x[2],bm:x[3]})),seq:100});
  S.bid="b1"; S.config=cfg; S.rooms=oldRooms.list.map(r=>Object.assign({},r,{students:r.students.map(s=>Object.assign({st:"in",inD:"",outD:"",why:""},s))}));
  S.att={};S.sc={};S.logs=ol.items||[];
  for(const r of S.rooms){
    const a=await readOld("att_"+r.id), c=await readOld("sc_"+r.id);
    S.att[r.id]={m:(a&&a.m)||{}};
    const sc=emptySc(); if(c){sc.due=c.due||{};
      Object.entries(c.f||{}).forEach(([sid,str])=>{const o={};[...str].forEach((ch,i)=>{if(ch!=="_") o["f"+i]=ch});sc.f[sid]=o});
      Object.entries(c.s||{}).forEach(([sid,arr])=>{const o={};(arr||[]).forEach((v,j)=>{if(!blank(v)) o["s"+j]=v});sc.s[sid]=o});
      if(c.q) sc.oldQ=c.q;}
    S.sc[r.id]=sc;
  }
  S.books.list=[{id:"b1",title:bookTitle(cfg)}];S.books.cur="b1";S.books.seq=2;
  for(const n of ["config","rooms","logs",...S.rooms.flatMap(r=>["att_"+r.id,"sc_"+r.id])]) await writeDoc(fullName(n),clone(docData(n)));
  await writeDoc("books",clone(S.books));
}
const bookTitle=c=>`${c.code||"(ไม่มีรหัส)"} ${c.subject||""} ม.${c.level} ${c.term?"ภาค "+c.term:""}`.replace(/\s+/g," ").trim();
async function openBook(bid){
  await flushAll(); unwatchBook();
  S.bid=bid; S.config=newConfig(); S.rooms=[]; S.att={}; S.sc={}; S.logs=[];
  const [c,r,l]=await Promise.all(["config","rooms","logs"].map(n=>readDoc(fullName(n))));
  applyDoc("config",c);applyDoc("rooms",r);applyDoc("logs",l);
  const names=S.rooms.flatMap(x=>["att_"+x.id,"sc_"+x.id]);
  const ds=await Promise.all(names.map(n=>readDoc(fullName(n))));ds.forEach((d,i)=>applyDoc(names[i],d));
  S.rooms.forEach(ensureRoom);
  ["config","rooms","logs",...names].forEach(watch);
  S.ui.room=S.rooms[0]?S.rooms[0].id:null; S.ui.k=null; S.ui.item=null;
  if(S.books.cur!==bid){S.books.cur=bid;persist("books")}
}
function ensureRoom(r){
  S.att[r.id]=S.att[r.id]||{m:{}}; S.sc[r.id]=Object.assign(emptySc(),S.sc[r.id]||{});
  const P=S.config.perWeek; r.tt=r.tt||[]; while(r.tt.length<P) r.tt.push({day:Math.min(4,r.tt.length*2),period:1,place:""});
  r.students.forEach(s=>{if(!s.st) s.st="in"});
}
function softRender(){const a=document.activeElement;if(a&&a.matches("input,textarea,select")&&($("#view").contains(a)||$("#dlg").contains(a))) return; render()}

/* ---------------- calendar ---------------- */
const N=()=>S.config.sessions.length;
const isExam=k=>/^สอบ/.test(S.config.sessions[k-1]||"");
function sessDate(r,k){const P=S.config.perWeek,w=Math.floor((k-1)/P),slot=(k-1)%P,t=r.tt[slot]||{day:0};const d=parseD(S.config.start);d.setDate(d.getDate()+w*7+(+t.day||0));return d}
const isHol=d=>S.config.holidays.some(h=>h.d===iso(d));
function todaySession(r){const t=iso(new Date());let best=1;for(let k=1;k<=N();k++){const d=iso(sessDate(r,k));if(d===t) return k;if(d<=t) best=k}return best}
const enrolledOn=(st,d)=>(!st.inD||d>=st.inD)&&(!st.outD||d<st.outD);

/* ---------------- calculations ---------------- */
const room=()=>S.rooms.find(r=>r.id===S.ui.room);
const active=r=>r.students.filter(s=>s.st!=="out");
function attStr(rid,sid){return (S.att[rid].m[sid]||"").padEnd(N(),"_")}
function lastRecorded(rid){let last=0;for(const v of Object.values(S.att[rid].m)){for(let i=v.length-1;i>=0;i--){if(v[i]!=="_"){if(i+1>last) last=i+1;break}}}return last}
const items=()=>S.config.items, forms=()=>S.config.forms;
function qLevel(a){if(!a||a.length<8||a.some(blank)) return null;const v=a.map(Number);if(v.some(x=>x===0)) return 0;const c3=v.filter(x=>x===3).length,mn=Math.min(...v);
  if(mn>=2&&c3>=5) return 3; if(mn>=2) return 2; if(c3>=4) return 2; return 1}
function litLevel(a){if(!a||a.length<5||a.some(blank)) return null;const t=a.reduce((s,x)=>s+Number(x),0);return t>=13?3:t>=9?2:t>=5?1:0}
const gradeOf=v=>v>=80?"4":v>=75?"3.5":v>=70?"3":v>=65?"2.5":v>=60?"2":v>=55?"1.5":v>=50?"1":"0";
function slotTotals(sv){const t={um01:0,mid:0,um02:0,fin:0,none:0};items().forEach(it=>{const v=sv[it.id];if(!blank(v)) t[it.bm]=(t[it.bm]||0)+Number(v)});t.all=t.um01+t.mid+t.um02+t.fin;return t}
function studentStats(r,st,ctx){
  const c=S.config,a=attStr(r.id,st.sid),cnt={};CODES.forEach(x=>cnt[x]=0);let rec=0,T=0;
  for(let k=1;k<=N();k++){const d=iso(sessDate(r,k));if(!enrolledOn(st,d)) continue;if(isHol(sessDate(r,k))) continue;T++;const ch=a[k-1];if(ch!=="_"){rec++;if(cnt[ch]!=null) cnt[ch]++}}
  const absn=cnt["ล"]+cnt["ป"]+cnt["ข"],present=cnt["ม"]+cnt["ส"]+cnt["ก"];
  const remain=Math.floor(T*(1-c.attMin)+1e-9)-absn;
  let last3=0;for(let k=Math.max(1,ctx.last-2);k<=ctx.last;k++) if(a[k-1]==="ข") last3++;
  const attStatus=remain<0?"มส":remain<=c.near?"ใกล้ มส":"ปกติ";
  const sc=S.sc[r.id],f=sc.f[st.sid]||{},sv=sc.s[st.sid]||{};
  let formMiss=0;forms().forEach(fm=>{const v=f[fm.id];if(v==="x"||(blank(v)&&sc.due[fm.id])) formMiss++});
  let sumMiss=0,dueMax=0,earned=0;const missNames=[];
  items().forEach(it=>{if(sc.due[it.id]&&it.bm!=="mid"&&it.bm!=="fin"){dueMax+=Number(it.max);const v=sv[it.id];if(blank(v)){sumMiss++;missNames.push(it.name)}else earned+=Number(v)}});
  const pct=dueMax?earned/dueMax:null, tot=slotTotals(sv);
  const fullMax=items().filter(it=>it.bm!=="none").reduce((t,it)=>t+Number(it.max),0)||100;
  const finItems=items().filter(it=>it.bm==="fin"), finalDue=finItems.length>0&&finItems.every(it=>sc.due[it.id]);
  const examMiss=items().filter(it=>(it.bm==="mid"||it.bm==="fin")&&sc.due[it.id]&&blank(sv[it.id])).length;
  const result=!finalDue?"":attStatus==="มส"?"มส":(examMiss||sumMiss)?"ร":gradeOf(tot.all/fullMax*100);
  const indMap={};items().forEach(it=>{if(it.ind&&it.bm!=="mid"&&it.bm!=="fin"&&it.bm!=="none"){(indMap[it.ind]=indMap[it.ind]||[]).push(it)}});

let XL=null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(XL) return XL;
  XL=new Promise((res,rej)=>{const s=document.createElement("script");s.src=XLSX_URL;s.onload=()=>window.XLSX?res(window.XLSX):rej(new Error("load"));s.onerror=()=>{XL=null;rej(new Error("load"))};document.head.appendChild(s)});
  return XL;
}
const numOf=x=>typeof x==="number"?x:(typeof x==="string"&&/^\s*\d+(\.0+)?\s*$/.test(x)?Math.round(+x):null);
const isTh=x=>typeof x==="string"&&/[฀-๿]/.test(x)&&!/\d/.test(x);
const isSid=x=>{const n=numOf(x);return n!=null&&n>=1000&&n<=99999999};
/* rows: array of arrays. returns [{room,no,sid,name}] */
function parseRoster(rows,defRoom){
  const out=[];let cur=defRoom||null;
  for(const raw of rows){
    const row=(raw||[]).map(x=>x==null?"":x);
    for(const c of row){if(typeof c==="string"){const m=c.match(/ม\.?\s*\d\s*\/\s*(\d{1,2})/);if(m&&!isSid(c)) cur=String(+m[1])}}
    for(let c=0;c<row.length;c++){
      const a=row[c],b=row[c+1],d=row[c+2],e=row[c+3],f=row[c+4];
      // BookMark: id | ชื่อสกุล | ห้อง | เลขที่
      if(isSid(a)&&isTh(b)&&numOf(d)!=null&&numOf(d)<100&&numOf(e)!=null&&numOf(e)<100&&!isTh(d)){out.push({room:String(numOf(d)),no:numOf(e),sid:String(numOf(a)),name:normName(b)});c+=3;continue}
      // ใบคะแนน OMR: id | เลขที่ | ชื่อ | สกุล | ห้อง
      if(isSid(a)&&numOf(b)!=null&&numOf(b)<100&&isTh(d)&&isTh(e)&&numOf(f)!=null&&numOf(f)<100){out.push({room:String(numOf(f)),no:numOf(b),sid:String(numOf(a)),name:normName(d+" "+e)});c+=4;continue}
      // ใบรายชื่อ: เลขที่ | id | ชื่อ–สกุล [| สกุล]
      if(numOf(a)!=null&&numOf(a)>=1&&numOf(a)<100&&isSid(b)&&isTh(d)){let name=d;if(isTh(e)&&!/\s/.test(normName(d))){name=d+" "+e;c++}out.push({room:cur,no:numOf(a),sid:String(numOf(b)),name:normName(name)});c+=2;continue}
    }
  }
  const seen=new Set();return out.filter(x=>{if(seen.has(x.sid)) return false;seen.add(x.sid);return true});
}
async function importFile(file){
  try{
    let rows=[];
    if(/\.csv$/i.test(file.name)){rows=(await file.text()).split(/\r?\n/).map(l=>l.split(/,|\t/))}
    else{const X=await loadXLSX();const wb=X.read(await file.arrayBuffer(),{type:"array"});wb.SheetNames.forEach(n=>{rows=rows.concat(X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""}))})}
    const list=parseRoster(rows,null);
    if(!list.length){toast("ไม่พบรายชื่อนักเรียนในไฟล์นี้");return}
    if(list.some(x=>!x.room)){toast("บางรายชื่อไม่ทราบห้อง ใช้วิธีวางรายชื่อและระบุห้องแทน");return}
    reviewImport(list);
  }catch(e){console.error(e);toast(e&&e.message==="load"?"โหลดตัวอ่านไฟล์ Excel ไม่ได้ ตรวจการเชื่อมต่ออินเทอร์เน็ต":"อ่านไฟล์ไม่สำเร็จ")}
}
function pasteImport(){
  const rn=$("#impRoom").value.trim().replace(/^ม\.?\s*/,""),m=rn.match(/^\d+\/(\d+)$/),txt=$("#impText").value;
  const rows=txt.split(/\r?\n/).map(l=>{if(/\t|,/.test(l)) return l.split(/\t|,/).map(x=>x.trim());const t=l.trim().split(/\s+/);return t.length>=3&&/^\d+$/.test(t[0])&&/^\d+$/.test(t[1])?[t[0],t[1],t.slice(2).join(" ")]:[l]});
  const list=parseRoster(rows,m?String(+m[1]):null);

let IMP=null;
function diffRoster(list){
  const lv=S.config.level||"4",changes=[],byRoom={};
  list.forEach(x=>{(byRoom[x.room]=byRoom[x.room]||[]).push(x)});
  const where={};S.rooms.forEach(r=>r.students.forEach(s=>{where[s.sid]={r,s}}));
  Object.entries(byRoom).forEach(([rn,arr])=>{
    const rid=`${lv}-${rn}`,exist=S.rooms.find(r=>r.id===rid),initial=!exist||!exist.students.length;
    arr.forEach(x=>{
      const w=where[x.sid];
      if(!w) changes.push({t:initial?"new":"in",rid,x});
      else if(w.r.id!==rid) changes.push({t:"move",rid,from:w.r.id,x});
      else if(w.s.st==="out") changes.push({t:"in",rid,x,back:true});
      else{if(+w.s.no!==+x.no) changes.push({t:"no",rid,x,old:w.s.no});if(bareName(w.s.name)!==bareName(x.name)) changes.push({t:"name",rid,x,old:w.s.name})}
    });
    if(exist){const ids=new Set(list.map(x=>x.sid));exist.students.forEach(s=>{if(s.st!=="out"&&!ids.has(s.sid)) changes.push({t:"out",rid,x:{sid:s.sid,no:s.no,name:s.name}})})}
  });
  return changes;
}

   <p class="muted" style="font-size:14px">นักเรียนย้ายเข้า: นับเวลาเรียนตั้งแต่วันนี้เป็นต้นไป  นักเรียนย้ายออก: ไม่แสดงในการเช็กชื่อหลังวันนี้ ข้อมูลเดิมยังเก็บไว้</p>`:""}
   ${ch.some(c=>c.t==="out")?`<div class="note">ถ้าไฟล์นี้มีรายชื่อไม่ครบห้อง ให้เอาเครื่องหมายออกจากรายการ “ย้ายออก” ที่ไม่ถูกต้อง</div>`:""}
   <div style="max-height:46vh;overflow:auto;margin:8px 0">${ch.map((c,i)=>`<label class="chg"><input type="checkbox" data-chg="${i}" checked><span><span class="tag ${c.t==="name"?"no":c.t}">${L[c.t]}</span>${esc(c.x.name)} <span class="muted">${c.x.sid}  ${desc(c)}</span></span></label>`).join("")}</div>

const JSZIP_URL="jszip.min.js";
let JZ=null;
function loadJSZip(){
  if(window.JSZip) return Promise.resolve(window.JSZip);
  if(JZ) return JZ;
  JZ=new Promise((res,rej)=>{const s=document.createElement("script");s.src=JSZIP_URL;s.onload=()=>window.JSZip?res(window.JSZip):rej(new Error("load"));s.onerror=()=>{JZ=null;rej(new Error("load"))};document.head.appendChild(s)});
  return JZ;
}
const thDigits=s=>String(s??"").replace(/[๐-๙]/g,c=>"๐๑๒๓๔๕๖๗๘๙".indexOf(c));
const numIn=s=>{const m=thDigits(s).replace(/,/g,"").match(/\d+(\.\d+)?/);return m?Number(m[0]):null};
function slotOf(s){const t=thDigits(s).toLowerCase().replace(/\s+/g,"");
  if(/um01|ก่อนกลาง|ก่อนสอบกลาง/.test(t)) return "um01";
  if(/um02|หลังกลาง|หลังสอบกลาง/.test(t)) return "um02";
  if(/fin|ปลายภาค/.test(t)) return "fin";
  if(/mid|กลางภาค/.test(t)) return "mid";
  if(/ไม่ส่ง|none|^-$/.test(t)) return "none";
  return null}
const IND_RE=/[ก-ฮ]\s*\d+\.\d+\s*ม\.\s*\d(?:\s*-\s*\d)?\s*\/\s*\d+/g;
const indCodes=s=>[...new Set((thDigits(s).match(IND_RE)||[]).map(x=>x.replace(/\s+/g," ").replace(/([ก-ฮ])\s*(\d)/,"$1 $2").replace(/ม\.\s*/,"ม.").replace(/\s*\/\s*/,"/").replace(/\s*-\s*/,"-").replace(/(\d) ม\./,"$1 ม.")))].join(", ");
/* ก. paste */
function pasteForms(){const names=$("#psForms").value.split(/\r?\n/).map(x=>x.replace(/\t/g," ").trim()).filter(Boolean);
  if(!names.length){toast("ยังไม่ได้วางรายชื่อใบงาน");return}
  reviewStruct({forms:names.map(n=>({name:n,on:true})),items:[],fulls:{},src:"วางรายการ"})}
function pasteItems(){
  const lines=$("#psItems").value.split(/\r?\n/).filter(l=>l.trim());const items=[],bad=[];
  lines.forEach((l,i)=>{let c=l.includes("\t")?l.split("\t"):l.split(/\s{2,}|,/);c=c.map(x=>x.trim());
    if(c.length<4){bad.push(i+1);return}
    const max=numIn(c[2]),bm=slotOf(c[3]);
    if(/^ชื่องาน/.test(c[0])) return;
    if(max==null||!bm||!c[0]){bad.push(i+1);return}
    items.push({name:c[0],ind:c[1],max,bm,on:true})});
  if(!items.length){toast(bad.length?`อ่านไม่ได้ บรรทัดที่ ${bad.join(", ")}`:"ยังไม่ได้วางรายการคะแนน");return}
  reviewStruct({forms:[],items,fulls:{},src:"วางรายการ",bad})}
/* ข. วก.15 .docx */
async function readDocxBlocks(buf){
  const Z=await loadJSZip(),zip=await Z.loadAsync(buf),f=zip.file("word/document.xml");if(!f) throw new Error("notdocx");
  const xml=new DOMParser().parseFromString(await f.async("string"),"application/xml");
  const W="http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  const txt=el=>{let s="";el.getElementsByTagNameNS(W,"*");const walk=n=>{for(const c of n.childNodes){if(c.namespaceURI===W&&c.localName==="t") s+=c.textContent;else if(c.namespaceURI===W&&(c.localName==="tab")) s+="\t";else if(c.namespaceURI===W&&(c.localName==="br"||c.localName==="p")){walk(c);s+=" "}else if(c.nodeType===1) walk(c)}};walk(el);return s.replace(/[  ]+/g," ").trim()};
  const body=xml.getElementsByTagNameNS(W,"body")[0],out=[];
  for(const el of body.childNodes){if(el.nodeType!==1||el.namespaceURI!==W) continue;
    if(el.localName==="p") out.push({p:txt(el)});
    else if(el.localName==="tbl"){const rows=[];for(const tr of el.childNodes){if(tr.localName!=="tr") continue;const r=[];for(const tc of tr.childNodes){if(tc.localName==="tc") r.push(txt(tc))}rows.push(r)}out.push({t:rows})}}
  return out;
}
function parseVK15(blocks){
  const items=[],fulls={},forms=[],lessons=[],secUnits={};let cur=null,unit=null;
  blocks.forEach(b=>{
    if(b.p!=null){const t=b.p;const um=thDigits(t).match(/โครงสร้างหน่วยการเรียนรู้ที่\s*(\d+)\s*(?:เรื่อง\s*)?(.*)/);if(um){unit={n:+um[1],name:um[2].replace(/\s*ระดับชั้น.*$/,"").trim()}}
      if(/คะแนนเต็ม/.test(t)&&t.length<160){const s=slotOf(t.replace(/คะแนนเต็ม.*/,""));if(s&&s!=="none"){cur={slot:s,full:numIn(t.slice(t.indexOf("คะแนนเต็ม")))}}}return}
    const rows=b.t,h=(rows[0]||[]).join(" ");
    if(cur&&/ชื่อหน่วย/.test(h)&&/คะแนน/.test(h)){
      if(cur.full!=null) fulls[cur.slot]=cur.full;
      const data=rows.filter(r=>numIn(r[r.length-1])!=null&&!/ชื่อหน่วย/.test(r.join(" ")));
      data.forEach(r=>{(thDigits(r[0]).match(/\d+/g)||[]).forEach(n=>{if(+n<50)(secUnits[cur.slot]=secUnits[cur.slot]||[]).push(+n)})});
      let prev="";data.forEach((r,i)=>{const max=numIn(r[r.length-1]);let name=(r[0]||"").replace(/\s+/g," ").trim();
        const ind=indCodes(r.slice(1,-1).join(" "));
        if(cur.slot==="mid"||cur.slot==="fin"){name=(cur.slot==="mid"?"สอบกลางภาค":"สอบปลายภาค")+(data.length>1?` ${i+1}`:"")}
        else{if(!name) name=prev?prev+" (ต่อ)":"งานที่ "+(i+1);else prev=name;if(name.length>60) name=name.slice(0,60)+"…"}
        items.push({name,ind:ind||(cur.slot==="mid"?"กลางภาค":cur.slot==="fin"?"ปลายภาค":""),max,bm:cur.slot,on:true})});
      cur=null;return}
    if(/ลำดับ/.test(h)&&/(ชื่อเรื่อง|ชื่อโรงเรียน)/.test(h)){
      const hc=(rows[0]||[]).findIndex(x=>/เวลา/.test(x));
      rows.slice(1).forEach(r=>{if(/^\d+$/.test(thDigits(r[0]).trim())&&r[1]&&r[1].trim()!=="-"){const nm=r[1].replace(/\s+/g," ").trim();forms.push({name:nm,on:false});
        const hv=hc>=0?numIn(r[hc]):null;lessons.push({unit:unit?unit.n:null,unitName:unit?unit.name:"",name:nm,h:hv,flag:hv==null||hv%1!==0})}})}
  });
  return {items,fulls,forms,lessons,secUnits};
}
async function importVK15(file){
  if(!/\.docx$/i.test(file.name)){toast("รองรับเฉพาะไฟล์ .docx  ถ้าเป็น .doc ให้เปิดใน Word แล้วบันทึกเป็น .docx ก่อน");return}
  try{const r=parseVK15(await readDocxBlocks(await file.arrayBuffer()));
    if(!r.items.length){toast("ไม่พบตารางคะแนนในหัวข้อ ก่อนกลางภาค / กลางภาค / หลังกลางภาค / ปลายภาค");return}

function buildSessions(r){
  const L=r.lessons;if(!L.length) return null;
  const pre=(r.secUnits.um01||[]).concat(r.secUnits.mid||[]),midAfter=pre.length?Math.max(...pre):null;
  const out=[],notes=[];let midDone=false;
  L.forEach((x,i)=>{
    if(midAfter!=null&&!midDone&&x.unit!=null&&x.unit>midAfter){out.push("สอบกลางภาค");midDone=true}
    const h=Math.max(1,Math.round(x.h||1));if(x.flag) notes.push(`หน่วย ${x.unit??"?"} “${x.name}” ไม่ระบุชั่วโมงเป็นจำนวนเต็ม ใส่ไว้ ${h} คาบ`);
    for(let k=1;k<=h;k++) out.push(`หน่วย ${x.unit??"?"} ${x.name}${h>1?` (${k}/${h})`:""}`)});
  if(!midDone){out.push("สอบกลางภาค");notes.push("หาตำแหน่งสอบกลางภาคไม่ได้ ใส่ไว้ท้ายหน่วยทั้งหมด กรุณาย้ายเอง")}
  out.push("สอบปลายภาค");
  return {lines:out,notes,midAfter};
}

function bmName(n){const b=bareName(n);const i=b.indexOf(" ");return (i<0?b:b.slice(0,i)+"  "+b.slice(i+1)).padEnd(100," ")}
function bmStudents(){const out=[];S.rooms.slice().sort((a,b)=>roomNum(a)-roomNum(b)).forEach(r=>active(r).slice().sort((a,b)=>a.no-b.no).forEach(st=>out.push({r,st})));return out}
function bmCheck(kind){
  const list=bmStudents();let miss=0,dec=0;
  list.forEach(({r,st})=>{const sc=S.sc[r.id];
    if(kind==="quality"){if(qLevel(sc.q[st.sid])==null) miss++}
    else if(kind==="literacy"){if(litLevel(sc.lit[st.sid])==null) miss++}
    else{const sv=sc.s[st.sid]||{};items().filter(i=>i.bm===kind).forEach(i=>{if(blank(sv[i.id])) miss++;else if(Number(sv[i.id])%1) dec++})}});
  return {n:list.length,miss,dec};
}
function bmBuild(kind){
  const c=S.config,B=S.books,head=["เลขประจำตัว","ชื่อสกุล","ห้อง","เลขที่"];
  const sid=x=>/^\d+$/.test(x)?+x:x;
  let title,cols,rowOf;
  if(kind==="quality"){title=`คะแนนหน่วยการเรียนรู้รหัสวิชา ${c.code}  รหัสครู ${B.tcode} ${B.tname}`;
    cols=[];QSUB.forEach((k,i)=>{for(let j=1;j<=k;j++) cols.push(`QM${i+1}-${j}`);cols.push(`QM${i+1}`)});cols.push("Qgrade");
    rowOf=(r,st)=>{const q=S.sc[r.id].q[st.sid]||[],o=[];QSUB.forEach((k,i)=>{const v=blank(q[i])?"":Number(q[i]);for(let j=0;j<=k;j++) o.push(v)});const lv=qLevel(q);o.push(lv==null?"":lv);return o}}
  else if(kind==="literacy"){title=`คะแนนหน่วยการเรียนรู้รหัสวิชา ${c.code}  รหัสครู ${B.tcode} ${B.tname}`;cols=["คะแนน1","คะแนน2","คะแนน3","คะแนน4","คะแนน5","รวม"];
    rowOf=(r,st)=>{const l=S.sc[r.id].lit[st.sid]||[],lv=litLevel(l);return [0,1,2,3,4].map(i=>blank(l[i])?"":Number(l[i])).concat(lv==null?"":lv)}}
  else{title=kind==="um01"?`คะแนนหน่วยการเรียนรู้รหัสวิชา ${c.code} หน่วยที่ 01 รหัสครู ${B.tcode} ${B.tname}`:kind==="um02"?`คะแนนหน่วยการเรียนรู้รหัสวิชา ${c.code} หน่วยที่ 02 รหัสครู ${B.tcode} ${B.tname}`:kind==="mid"?`คะแนนรวมกลางภาครหัสวิชา ${c.code} กลางภาค รหัสครู ${B.tcode} ${B.tname}`:`คะแนนรวมปลายภาครหัสวิชา ${c.code} ปลายภาค รหัสครู ${B.tcode} ${B.tname}`;
    cols=["คะแนน1","คะแนน2","คะแนน3","คะแนน4","คะแนน5","รวม"];
    rowOf=(r,st)=>{const v=slotTotals(S.sc[r.id].s[st.sid]||{})[kind];return [v,0,0,0,0,v]}}
  const aoa=[[title],head.concat(cols)];
  bmStudents().forEach(({r,st})=>aoa.push([sid(st.sid),bmName(st.name),roomNum(r),Number(st.no)].concat(rowOf(r,st))));
  return {aoa,ncol:head.length+cols.length,filename:`${c.code}-${kind==="quality"||kind==="literacy"?kind:SLOT_FILE[kind]}-${B.tcode}.xlsx`};
}

  if(d.snap){const sn=KV.cache[d.snap];if(sn) await replaceAll(clone(sn.docs),`ย้อนกลับไปใช้ข้อมูลที่สำรองอัตโนมัติเมื่อ ${thD(parseD(d.snap.slice(5,15)),{day:"numeric",month:"short",year:"numeric"})}`);return}
  if(d.bm){await bmExport(d.bm);return}
  if(d.export){d.export==="json"?exportJSON():exportCSV(d.export);return}
}
document.addEventListener("change",async e=>{
  const t=e.target,d=t.dataset;
  try{
  if(d.due){const sc=S.sc[room().id];sc.due[d.due]=t.checked;persist("sc_"+room().id);render();return}
  if(d.score){const r=room(),sc=S.sc[r.id],id=S.ui.item.split(":")[1],m=items().find(x=>x.id===id),mx=Number(m.max);let v=t.value===""?null:Number(t.value);
    const o=sc.s[d.score]=sc.s[d.score]||{};
    if(v!=null&&(isNaN(v)||v<0||v>mx)){toast(`คะแนนต้องอยู่ระหว่าง 0–${mx}`);t.value=blank(o[id])?"":o[id];return}
    if(v==null) delete o[id];else o[id]=v;persist("sc_"+r.id);t.classList.toggle("missing",!!sc.due[id]&&v==null);return}
  if(d.cfg){S.config[d.cfg]=t.value.trim();persist("config");syncTitle();render();return}
  if(d.cfgp){S.config[d.cfgp]=Math.max(0,Math.min(100,+t.value))/100;persist("config");return}
  if(d.cfgn){let v=Math.max(0,Math.round(+t.value));if(d.cfgn==="perWeek"){v=Math.max(1,Math.min(5,v||1));S.config.perWeek=v;S.rooms.forEach(ensureRoom);persist("rooms")}else S.config[d.cfgn]=v;persist("config");render();return}
  if(d.bk){S.books[d.bk]=t.value;persist("books");return}
  if(t.matches("[data-sessions]")){const lines=t.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!lines.length){toast("ต้องมีอย่างน้อย 1 คาบ");t.value=S.config.sessions.join("\n");return}S.config.sessions=lines;persist("config");render();toast(`บันทึกคาบเรียน ${lines.length} คาบ`);return}
  if(d.fname){const x=S.config.forms.find(f=>f.id===d.fname);x.name=t.value.trim()||x.name;persist("config");return}
  if(d.iname){const x=S.config.items.find(f=>f.id===d.iname);x.name=t.value.trim()||x.name;persist("config");return}
  if(d.iind!=null&&t.matches("[data-iind]")){S.config.items.find(f=>f.id===d.iind).ind=t.value.trim();persist("config");return}
  if(d.imax){const v=+t.value;if(!(v>0)){toast("คะแนนเต็มต้องมากกว่า 0");return}S.config.items.find(f=>f.id===d.imax).max=v;persist("config");render();return}
  if(d.ibm){S.config.items.find(f=>f.id===d.ibm).bm=t.value;persist("config");render();return}
  if(d.lit){S.config.litNames[+d.lit]=t.value.trim()||`รายการที่ ${+d.lit+1}`;persist("config");return}
  if(d.tt){const [rid,i,f]=d.tt.split(":");const r=S.rooms.find(x=>x.id===rid);r.tt[+i][f]=f==="place"?t.value:+t.value;persist("rooms");return}
  if(d.sdate){const [rid,sid,f]=d.sdate.split("|");const s=S.rooms.find(x=>x.id===rid).students.find(x=>x.sid===sid);s[f]=t.value;persist("rooms");render();return}
  if(t.matches("[data-vk15s]")){const f=t.files[0];t.value="";if(f) await importVK15Sessions(f);return}
  if(t.matches("[data-credits]")){await setCredits(t.value===""?null:Number(t.value));return}
  if(t.matches("[data-vk15]")){const f=t.files[0];t.value="";if(f) await importVK15(f);return}
  if(d.sti!=null){STR.items[+d.sti].on=t.checked;reviewStruct(STR);return}
  if(d.stf!=null){STR.forms[+d.stf].on=t.checked;return}
  if(d.stn!=null){STR.items[+d.stn].name=t.value;return}
  if(d.stind!=null){STR.items[+d.stind].ind=t.value;return}
  if(d.stm!=null){STR.items[+d.stm].max=Number(t.value)||0;reviewStruct(STR);return}
  if(d.stb!=null){STR.items[+d.stb].bm=t.value;reviewStruct(STR);return}
  if(t.matches("[data-rosterfile]")){const f=t.files[0];t.value="";if(f) await importFile(f);return}
  if(t.matches("[data-restoreall]")||t.matches("[data-importbook]")){const file=t.files[0];t.value="";if(!file) return;let o;try{o=JSON.parse(await file.text())}catch(err){toast("ไฟล์นี้ไม่ใช่ไฟล์สำรองของสมุด");return}
    if(o&&o.v===3&&o.docs&&t.matches("[data-restoreall]")){await replaceAll(o.docs,`กู้คืนจากไฟล์สำรองทุกวิชา (สำรองเมื่อ ${o.at?thD(new Date(o.at),{day:"numeric",month:"short",year:"numeric"}):"-"})`);return}
    if(o&&o.config&&o.rooms){await importBookFile(o);return}
    toast(t.matches("[data-restoreall]")?"ไฟล์นี้ไม่ใช่ไฟล์สำรองทุกวิชา":"ไฟล์นี้ไม่ใช่ไฟล์สำรองรายวิชา");return}
  if(t.matches("[data-restore]")){const file=t.files[0];t.value="";if(!file) return;let o;try{o=JSON.parse(await file.text())}catch(err){toast("ไฟล์นี้ไม่ใช่ไฟล์สำรองของสมุด");return}
    if(!o||!o.rooms||!o.config){toast("ไฟล์นี้ไม่ใช่ไฟล์สำรองของสมุด");return}
    if(!await ask(`กู้คืนจะแทนที่ข้อมูลทั้งหมดของสมุด “${esc(bookTitle(S.config))}” ดำเนินการต่อ?`,"กู้คืน")) return;
    if(!o.v){toast("ไฟล์สำรองรุ่นเดิม: ใช้ได้เฉพาะรายชื่อและเช็กชื่อ");o={config:Object.assign({},S.config,{start:o.config.start||S.config.start,holidays:o.config.holidays||[]}),rooms:o.rooms,att:o.att||{},sc:{},logs:o.logs||[]}}
    S.config=newConfig(o.config);S.rooms=o.rooms;S.att=o.att||{};S.sc=o.sc||{};S.logs=o.logs||[];S.rooms.forEach(r=>{ensureRoom(r);watch("att_"+r.id);watch("sc_"+r.id)});S.ui.room=S.rooms[0]&&S.rooms[0].id;S.ui.k=null;
    ["config","rooms","logs",...S.rooms.flatMap(r=>["att_"+r.id,"sc_"+r.id])].forEach(persist);syncTitle();render();toast("กู้คืนข้อมูลแล้ว")}
  }catch(err){console.error(err);toast("เกิดข้อผิดพลาด ("+(err&&err.message||err)+")")}
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="logForm") return;e.preventDefault();
  const f=e.target,fd=Object.fromEntries(new FormData(f).entries());
  if(!fd.sid){toast("เลือกนักเรียนก่อน");return}
  const id=f.dataset.id||("L"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
  const rec=Object.assign({id,room:f.dataset.room},fd);
  const i=S.logs.findIndex(x=>x.id===id);if(i>=0) S.logs[i]=rec;else S.logs.push(rec);
  persist("logs");closeDlg();render();toast("บันทึกแล้ว");
});
$("#cfm").addEventListener("cancel",()=>{const r=cfmResolve;cfmResolve=null;if(r) r(false)});
boot();
</script>
